name: Build check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Confirm this is a JavaScript web project
        id: project
        shell: bash
        run: |
          if [[ ! -f package.json ]]; then
            echo "This repository does not yet contain package.json, so there is no website build to run." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
